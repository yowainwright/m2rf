name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  dependency-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/setup@v2
        with:
          version: 12.2.1
          cache: true
          install: false
          runtime: node@26

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Pastoralist security check
        run: pnpm run deps:security

  lint-and-typecheck:
    runs-on: ubuntu-24.04
    env:
      FS_LINT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/setup@v2
        with:
          version: 12.2.1
          cache: true
          install: false
          runtime: node@26

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install shell lint tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Install structure linters
        run: |
          /home/linuxbrew/.linuxbrew/bin/brew install yowainwright/tap/fs-lint yowainwright/tap/src-lint
          echo /home/linuxbrew/.linuxbrew/bin >> "$GITHUB_PATH"

      - name: Type check
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint:ci

      - name: Check build
        run: pnpm run build

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/setup@v2
        with:
          version: 12.2.1
          cache: true
          install: false
          runtime: node@26

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm run test:unit

      - name: Run integration tests
        run: pnpm run test:integration
